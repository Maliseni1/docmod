<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocMod - No Connection</title>
<style>
  :root {
    --paper: #F7F4EC;
    --surface: #FFFEFB;
    --ink: #1C1A17;
    --ink-muted: #6B6456;
    --border: #E7E0D2;
    --accent: #B9491F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 2rem;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2.5rem 2rem;
    text-align: center;
    box-shadow: 0 1px 2px rgba(28,26,23,0.06), 0 4px 12px rgba(28,26,23,0.06);
  }
  .logo {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    margin-bottom: 0.75rem;
  }
  .brand {
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--accent);
    letter-spacing: -0.3px;
    margin-bottom: 1.75rem;
  }
  .illustration {
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 0.75rem;
  }
  p {
    font-size: 0.95rem;
    color: var(--ink-muted);
    line-height: 1.6;
    margin-bottom: 1.75rem;
  }
  p a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
  p a:hover {
    text-decoration: underline;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover {
    background: #8F3717;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/android-chrome-192x192.png" alt="" />
    <div class="brand">DocMod</div>

    <svg class="illustration" width="160" height="90" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 45 H54" stroke="#6B6456" stroke-width="4" stroke-linecap="round"/>
      <rect x="50" y="34" width="18" height="22" rx="4" stroke="#1C1A17" stroke-width="3"/>
      <path d="M150 45 H106" stroke="#6B6456" stroke-width="4" stroke-linecap="round"/>
      <rect x="92" y="34" width="18" height="22" rx="4" stroke="#1C1A17" stroke-width="3"/>
      <path d="M78 26 L70 45 L80 45 L72 64" stroke="#B9491F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>No internet connection</h1>
    <p>
      The offline version is in the works. For updates on its launch and
      other useful software, check out
      <a href="https://chizalabs.com" target="_blank" rel="noopener">chizalabs.com</a>.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
